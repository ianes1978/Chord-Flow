name: Deploy web to GitHub Pages

# Pubblica la build web di Chord Flow su GitHub Pages spingendo il risultato sul
# branch `gh-pages`. Questo metodo NON usa l'environment protetto "github-pages",
# quindi non è soggetto alle sue regole sui branch di deploy.
on:
  push:
    branches:
      - claude/mano-ferma-flutter-6ouyz6
  workflow_dispatch:

permissions:
  contents: write # serve per spingere il branch gh-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - run: flutter pub get

      # base-href = nome del repository, così i percorsi funzionano sul project
      # site di GitHub Pages (https://<utente>.github.io/<repo>/).
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy su branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
