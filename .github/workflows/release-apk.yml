name: Release APK

# Costruisce l'APK di release di Chord Flow e lo allega a una GitHub Release.
# Si attiva spingendo un tag "v*" (es. v1.0.0) oppure manualmente dalla tab
# Actions indicando il nome del tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/nome della release (es. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # necessario per creare la release e caricare l'asset

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/chord-flow-release.apk

      # Determina il nome del tag sia da push del tag sia da run manuale.
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chord-flow-release-apk
          path: dist/chord-flow-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Chord Flow ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/chord-flow-release.apk
